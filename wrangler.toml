name = "github-hot-repos"
main = "src/worker.js"
compatibility_date = "2026-06-01"

# Every issue's HTML (issues/*.html) bundles into the Worker as text.
rules = [
  { type = "Text", globs = ["**/*.html"] },
]

# Optional: set a GitHub token to lift the 60 req/hr unauthenticated limit.
#   npx wrangler secret put GITHUB_TOKEN
